{{- if ne (include "standard-app.kind" .) "cron" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
spec:
  # Si autoscaling.enabled, HPA gère les replicas — on ne fixe pas ce champ
  # pour éviter les conflits entre HPA et Deployment spec.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- if eq (include "standard-app.kind" .) "service" }}
    # Service à état (disque) : jamais deux instances sur les mêmes données ;
    # l'ancienne s'arrête avant que la nouvelle démarre.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
    {{- end }}
  selector:
    matchLabels:
      {{- include "standard-app.selectorLabels" . | nindent 6 }}
  template:
    {{- include "standard-app.podTemplate" . | nindent 4 }}
{{- end }}
