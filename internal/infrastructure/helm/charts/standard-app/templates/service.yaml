{{- if eq (include "standard-app.kind" .) "web" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: {{ .Values.service.protocol | default "TCP" }}
    {{- if .Values.extraPorts }}
    {{- include "standard-app.extraServicePorts" . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "standard-app.selectorLabels" . | nindent 4 }}
{{- else if eq (include "standard-app.kind" .) "service" }}
{{- /* Service interne (Redis, gRPC…) : le vrai port, joignable par son nom
       depuis les conteneurs du projet ; jamais d'Ingress ni d'adresse publique. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: tcp
      port: {{ .Values.service.targetPort }}
      targetPort: tcp
      protocol: TCP
    {{- if .Values.extraPorts }}
    {{- include "standard-app.extraServicePorts" . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "standard-app.selectorLabels" . | nindent 4 }}
{{- else if and (eq (include "standard-app.kind" .) "worker") .Values.extraPorts }}
{{- /* Worker avec ports internes supplémentaires : un Service pour eux seuls,
       joignable par son nom depuis les conteneurs du projet. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    {{- include "standard-app.extraServicePorts" . | nindent 4 }}
  selector:
    {{- include "standard-app.selectorLabels" . | nindent 4 }}
{{- end }}
