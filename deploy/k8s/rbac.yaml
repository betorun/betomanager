# Compte de la plateforme (API et worker) sur le cluster k3s du serveur 2.
#
# Droits à l'échelle du cluster : chaque projet crée son espace de noms à la
# volée, une liaison par espace n'existe donc pas encore quand il faut y écrire.
# Le compte peut lire tous les Secrets, mais n'a aucun droit sur le RBAC, les
# nœuds, les CRD ni exec/port-forward : une fuite du kubeconfig coûte moins cher
# qu'avec le kubeconfig admin de k3s.
#
# Appliqué et testé sur k3s avec helm et le chart (voir README.txt, « Vérifié »).
apiVersion: v1
kind: Namespace
metadata:
  name: betorun-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: betorun-platform
  namespace: betorun-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: betorun-platform-token
  namespace: betorun-system
  annotations:
    kubernetes.io/service-account.name: betorun-platform
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: betorun-platform
rules:
  - apiGroups: [""]
    resources: [namespaces, resourcequotas, secrets, configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # Santé du cluster (registre multi-cluster) : nœuds en lecture seule.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # Agent réseau des IP de sortie (DaemonSet de betorun-system, ADR 0014).
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Arrêt et redémarrage d'un conteneur (lifecycle.go : GetScale, UpdateScale).
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # Conteneurs « cron » : CronJob (suspendre/reprendre, exécuter maintenant).
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Middlewares du chart (redirection HTTPS, plafond).
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  # Consommation des conteneurs (metrics-server de k3s).
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  # Bases Postgres gérées (CloudNativePG, à installer : voir README.txt).
  # Les secrets de connexion <cluster>-app sont lus via la règle des secrets.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, scheduledbackups, backups]
    verbs: [get, list, watch, create, update, patch, delete]
  # Sauvegardes des bases (plugin Barman Cloud, à installer : voir README.txt).
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch, create, update, patch, delete]
  # IP de sortie dédiée des projets (Cilium, ADR 0014) : une règle par projet.
  - apiGroups: [cilium.io]
    resources: [ciliumegressgatewaypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # État des certificats HTTPS des domaines (cert-manager), lecture seule :
  # les Certificate sont créés par cert-manager depuis les Ingress.
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: betorun-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: betorun-platform
subjects:
  - kind: ServiceAccount
    name: betorun-platform
    namespace: betorun-system
