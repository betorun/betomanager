# Configuration golangci-lint du dépôt (v2). Linters par défaut ; errcheck
# ignore les appels dont l'erreur ne porte pas d'information utile ici :
#   - fmt.Fprint* : sorties de la CLI vers le terminal ;
#   - fermetures de lecture (corps de réponse HTTP, flux, fichiers ouverts en
#     lecture) et nettoyage de fichiers temporaires (os.Remove).
# Règle tenue à la main : sur un chemin d'ÉCRITURE, Close est contrôlé
# explicitement (cli/config, cli/iam, archives, cmd/dev-docs) — ne pas
# s'abriter derrière ces exclusions pour un fichier écrit.
version: "2"
linters:
  settings:
    staticcheck:
      # Défauts de golangci, sans deux suggestions de réécriture jugées
      # moins lisibles ici : QF1001 (loi de De Morgan), QF1008 (champ
      # embarqué omis du sélecteur : exp.Time.Add reste plus clair).
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1008"]
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - os.Remove
        - (*debug/elf.File).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (*net/http.Server).Close
        - (*net/smtp.Client).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*io.PipeReader).Close
  exclusions:
    rules:
      # Tests : les erreurs utiles sont vérifiées par assertion ; le reste
      # (fermetures, écritures dans un httptest) n'apporte rien.
      - path: _test\.go
        linters: [errcheck]
